[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-capital-monitor"
version = "0.2.0"
description = "Traceable macroeconomic and financial data backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "alembic>=1.13,<2",
    "python-calamine>=0.5,<1",
    "pypdf==6.21.4",
    "numpy>=1.26,<3",
    "rdata>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
