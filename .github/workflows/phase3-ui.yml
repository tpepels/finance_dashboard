name: Phase 3 frontend checks
on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - scripts/prepare_public_dashboard.py
      - tests/test_public_dashboard.py
      - .github/workflows/phase3-ui.yml
  pull_request:
    paths:
      - frontend/**
      - scripts/prepare_public_dashboard.py
      - tests/test_public_dashboard.py
      - .github/workflows/phase3-ui.yml
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed publicly redistributable static data contract
        run: python -m unittest discover -s tests -p 'test_public_dashboard.py' -v
      - name: Install one minimal frontend
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Test display transformations without a server
        run: npm --prefix frontend test
      - name: Compile and bundle React/ECharts for static deployment
        run: npm --prefix frontend run build
      - name: Reject missing frontend index
        run: test -s frontend/dist/index.html
