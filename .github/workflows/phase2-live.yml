name: Phase 2 live acceptance

# Separate from <5-minute offline CI: real network/provider data and Docker
# should not make every pull request slow or flaky.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/phase2-live.yml
      - scripts/live_bis_check.py
      - scripts/deployment_smoke.py

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python backend
        run: python -m pip install -e .
      - name: Verify live BIS source responses (three countries)
        run: python scripts/live_bis_check.py
      - name: Prepare disposable Docker credentials
        run: printf 'POSTGRES_PASSWORD=ci_phase2_local_only_92746\n' > .env
      - name: Build and launch database, migrations and API
        run: docker compose up --build -d --wait postgres migrate app
      - name: Ingest actual BIS history into PostgreSQL
        run: docker compose run --rm worker python -m finance_dashboard.worker --once --full
      - name: Verify stored observations via FastAPI
        run: python scripts/deployment_smoke.py
      - name: Log containers after failure
        if: failure()
        run: docker compose logs --tail=90 || true
      - name: Clean up disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans || true
