name: Verify Wisesheets key and financial data contract
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_wisesheets.py
      - .github/workflows/wisesheets-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - name: Inspect entitlement and response shapes without disclosing key
        env:
          WISESHEETS_API_KEY: ${{ secrets.WISESHEETS_API_KEY }}
        run: python scripts/probe_wisesheets.py
