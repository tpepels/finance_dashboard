name: Build static market data

# No frontend is deployed here. This produces an audited dataset artifact.
# Includes the validated monthly Wisesheets aggregate snapshot when present;
# the daily build never accesses WISESHEETS_API_KEY or re-crawls SEC filers.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/static-data.yml
      - src/finance_dashboard/**
      - definitions/**
      - pyproject.toml
      - tests/test_static_export.py
      - data/wisesheets/**

permissions:
  contents: read

concurrency:
  group: finance-static-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install existing ingestion backend
        run: python -m pip install -e .
      - name: Test explicit JSON allowlists and secret handling
        run: python -m unittest discover -s tests -p 'test_static_export.py' -v
      - name: Verify private FRED key against official API
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m finance_dashboard.static_export --probe-fred-key
      - name: Generate complete source-validated JSON datasets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m finance_dashboard.static_export --output-dir build/static-data --max-workers 6
      - name: Check committed Wisesheets aggregate appears in static JSON
        run: python scripts/verify_static_wisesheets.py
      - name: Upload key-free data artifact for the future Pages frontend
        uses: actions/upload-artifact@v4
        with:
          name: finance-dashboard-static-data
          path: build/static-data/
          if-no-files-found: error
          retention-days: 14
