name: Probe OECD annual and DBnomics mirror source
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/diagnose_oecd_provider.py
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          timeout 80s python scripts/diagnose_oecd_provider.py
