name: Market data availability probe
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_market_feeds.py
      - .github/workflows/market-discovery.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - run: python scripts/probe_market_feeds.py
