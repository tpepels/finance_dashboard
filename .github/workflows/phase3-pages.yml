name: Publish licence-filtered macro dashboard
# Manually dispatched only; never publish the 37 rights-review sources.
# Existing GitHub Pages repository configuration must authorize Actions deploys.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: macro-github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audited Python providers and frontend
        run: |
          python -m pip install -e .
          npm --prefix frontend install --no-audit --no-fund
      - name: Collect verified private source observations in Actions workspace
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m finance_dashboard.static_export --macro-only --output-dir build/temporary-private
      - name: Release only explicitly CC-BY public sources
        run: python scripts/prepare_public_dashboard.py --input build/temporary-private --output frontend/public/data
      - name: Check independent no-leakage and display transform tests
        run: |
          python -m unittest discover -s tests -p 'test_public_dashboard.py' -v
          npm --prefix frontend test
      - name: Build GitHub Pages static frontend
        env:
          GITHUB_PAGES: '1'
          VITE_DATA_MODE: static
        run: npm --prefix frontend run build
      - name: Verify published artifact contains only public source payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('frontend/dist/data')
          manifest=json.loads((root/'index.json').read_text())
          assert manifest['public_dataset'] is True
          assert manifest['series_count']>=1
          assert all(s['rights']=='cc_by_4_0' for s in manifest['series'])
          assert len(list((root/'series').glob('*.json')))==manifest['series_count']
          assert not any((root/p).exists() for p in ('markets','fx','supplementary'))
          print('PAGES_RIGHTS_GATE=PASS licensed='+str(manifest['series_count']))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
