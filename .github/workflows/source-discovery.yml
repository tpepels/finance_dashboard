name: Source discovery (bounded)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/source_discovery.py
      - .github/workflows/source-discovery.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/source_discovery.py
