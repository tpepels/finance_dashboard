# Temporary maintenance workflow: regenerate the locked dependency graph for
# newly introduced numerical dependencies, then remove this workflow.
name: Regenerate numerical dependency lock
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-numerics-lock.yml
      - pyproject.toml
permissions:
  contents: write
concurrency:
  group: numerical-lock-refresh-main
  cancel-in-progress: false
jobs:
  lock:
    if: github.repository == 'tpepels/finance_dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv lock
      - name: Commit complete resolved lockfile
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv.lock
            git commit -m "Lock NumPy runtime for ICIO Leontief analysis"
            git push origin HEAD:main
          fi
