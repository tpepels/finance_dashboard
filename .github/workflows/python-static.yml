name: Python architecture and full offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - name: Install runtime and test dependencies
        run: |
          uv lock --check
          uv sync --frozen --extra test
          uv tool install ruff==0.14.3
      - name: Syntax and critical Python errors
        run: |
          uv run --frozen --extra test python -m compileall -q src tests migrations
          ruff check --select E9,F63,F7 src tests migrations
      - name: CLI architecture and offline integration suite
        run: uv run --frozen --extra test python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Supported commands are importable and provide help
        run: |
          uv run --frozen --extra test python -m finance_dashboard validate
          uv run --frozen --extra test python -m finance_dashboard research operating --help
          uv run --frozen --extra test python -m finance_dashboard sources alfred-revisions --help
          uv run --frozen --extra test python -m finance_dashboard stan pipeline --help
          uv run --frozen --extra test python -m finance_dashboard backup restore --help

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  release-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone Compose
        run: docker compose config --quiet
      - name: Build the frozen release image
        run: docker build --tag finance-dashboard:ci .
      - name: Isolated startup, permissions, persistence and recovery
        run: python tests/container_smoke.py --image finance-dashboard:ci

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/browser/package-lock.json
      - name: Install locked Python and browser dependencies
        run: |
          uv sync --frozen --extra test
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix tests/browser ci --no-audit --no-fund
          npm --prefix tests/browser exec -- playwright install --with-deps chromium
      - name: Build UI and check isolated fixture installations
        run: |
          npm --prefix frontend run build
          node tests/browser/browser_smoke.mjs --python .venv/bin/python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: output/playwright/
