name: Python architecture and full offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[test]' ruff==0.14.3
      - name: Syntax and critical Python errors
        run: |
          python -m compileall -q src tests migrations
          ruff check --select E9,F63,F7 src tests migrations
      - name: CLI architecture and offline integration suite
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Supported commands are importable and provide help
        run: |
          python -m finance_dashboard validate
          python -m finance_dashboard research operating --help
          python -m finance_dashboard sources alfred-revisions --help
          python -m finance_dashboard stan pipeline --help
