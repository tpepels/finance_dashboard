name: MSCI official profile discovery
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_msci_profile.py
      - .github/workflows/probe-msci-profile.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx
      - run: python scripts/probe_msci_profile.py
