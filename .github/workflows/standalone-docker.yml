name: Single-container dashboard smoke
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.standalone
      - scripts/run-standalone.sh
      - frontend/**
      - src/finance_dashboard/standalone.py
      - src/finance_dashboard/api.py
      - src/finance_dashboard/database.py
      - tests/test_standalone.py
      - .github/workflows/standalone-docker.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-container:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test same-origin frontend, API, SQLite WAL persistence and refresh startup
        run: |
          pip install -e .
          python -m unittest discover -s tests -p 'test_standalone.py' -v
      - name: Check drop-in Compose service syntax
        run: |
          printf "services:\n" > /tmp/finance-service-check.yml
          cat docs/home-server-finance-service.yml >> /tmp/finance-service-check.yml
          env UID="$(id -u)" GID="$(id -g)" TZ="UTC" docker compose -f /tmp/finance-service-check.yml config --quiet
      - name: Build single image with React, API and SQLite
        run: docker build -f Dockerfile.standalone -t finance-dashboard:one .
      - name: Launch one running container (no PostgreSQL/worker/frontend dependencies)
        run: |
          mkdir -p /tmp/finance-dashboard-persistent
          docker run -d --name finance-dashboard-smoke \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:5052:8080 \
            --volume /tmp/finance-dashboard-persistent:/data \
            --env FINANCE_AUTO_REFRESH=0 \
            finance-dashboard:one
      - name: Verify first migration, real built frontend, read API and persistent restart
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base='http://127.0.0.1:5052'
          for attempt in range(35):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=3) as r: healthy=json.load(r)
                  assert healthy['database']=='connected'
                  break
              except Exception:
                  time.sleep(1)
          else: raise AssertionError('Standalone container never became healthy')
          with urllib.request.urlopen(base+'/') as r: index=r.read().decode()
          assert 'Global Capital Monitor' in index
          with urllib.request.urlopen(base+'/api/series') as r: definitions=json.load(r)
          assert len(definitions['items'])==42
          with urllib.request.urlopen(base+'/api/charts') as r: charts=json.load(r)
          assert len(charts['items'])==24
          req=urllib.request.Request(base+'/api/query',method='POST',
              data=b'{"series_ids":["policy_rate.us.bis"]}',
              headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req) as r: query=json.load(r)
          assert query['series'][0]['status']=='no_data'
          print('ONE_CONTAINER_UI_API=PASS series=42 charts=24',flush=True)
          PY
          test -s /tmp/finance-dashboard-persistent/finance.sqlite3
          docker restart finance-dashboard-smoke
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5052/api/health',timeout=3) as r:
                      assert json.load(r)['status']=='ok'
                  break
              except Exception: time.sleep(1)
          else: raise AssertionError('Container failed after restart')
          print('ONE_CONTAINER_SQLITE_RESTART=PASS')
          PY
      - name: Show short diagnostics on failure
        if: failure()
        run: docker logs --tail=90 finance-dashboard-smoke || true
      - name: Cleanup
        if: always()
        run: docker rm -f finance-dashboard-smoke || true
