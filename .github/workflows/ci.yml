name: Fast backend checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: pip install -e .
      - name: Validate definitions
        run: python -m finance_dashboard validate
      - name: Offline contracts and pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Verify migration against SQLite
        run: |
          DATABASE_URL=sqlite+pysqlite:////tmp/capital-monitor-migration-test.db alembic upgrade head
          DATABASE_URL=sqlite+pysqlite:////tmp/capital-monitor-migration-test.db alembic current
