name: Phase 2 multisource acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - src/finance_dashboard/providers.py
      - src/finance_dashboard/service.py
      - src/finance_dashboard/worker.py
      - src/finance_dashboard/api.py
      - scripts/live_providers_check.py
      - tests/test_providers.py
      - .github/workflows/phase2-sources.yml

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Verify mapped source samples
        run: python scripts/live_providers_check.py
