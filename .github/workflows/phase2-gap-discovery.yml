name: Phase 2 remaining-source discovery
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/phase2_gap_discovery.py
      - .github/workflows/phase2-gap-discovery.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install httpx
      - name: Probe remaining providers
        run: python scripts/phase2_gap_discovery.py
