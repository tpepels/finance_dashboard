name: Live market PostgreSQL acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/market_deployment_smoke.py
      - .github/workflows/market-postgres-acceptance.yml
jobs:
  market-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable DB credentials
        run: printf 'POSTGRES_PASSWORD=market_live_ci_87369\n' > .env
      - name: Start PostgreSQL, migrations and API
        run: docker compose up --build -d --wait postgres migrate app
      - name: Ingest ALL 24 instruments and 3 ECB FX feeds
        run: docker compose run --rm worker python -m finance_dashboard.worker --once --market-only
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify stored historical data and derived EUR returns
        run: python scripts/market_deployment_smoke.py
      - name: Show logs on failed acceptance
        if: failure()
        run: docker compose logs --tail=70 || true
      - name: Remove ephemeral database
        if: always()
        run: docker compose down --volumes --remove-orphans || true
