name: Wisesheets SEC annual earnings live sample
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/wisesheets_live_sample.py
      - .github/workflows/wisesheets-live-sample.yml
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify SEC earnings, ECB annual flow FX, and world GDP
        env:
          WISESHEETS_API_KEY: ${{ secrets.WISESHEETS_API_KEY }}
        run: python scripts/wisesheets_live_sample.py
