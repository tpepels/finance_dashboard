name: FRED public table discovery
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_fred_public.py
      - .github/workflows/fred-public-discovery.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/probe_fred_public.py
