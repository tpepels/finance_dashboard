name: Market-source acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/market_live_check.py
      - .github/workflows/market-live-check.yml
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/market_live_check.py
