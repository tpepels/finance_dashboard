name: Phase 2 exact remaining-source verification
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_bea_msci.py
      - .github/workflows/probe-bea-msci.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/probe_bea_msci.py
