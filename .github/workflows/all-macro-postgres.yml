name: Full mapped macro PostgreSQL acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/all_macro_pg_smoke.py
      - .github/workflows/all-macro-postgres.yml
      - migrations/**
jobs:
  all-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable DB password
        run: echo 'POSTGRES_PASSWORD=macro_ci_ephemeral_7332' > .env
      - name: Build and start PostgreSQL/migration/API
        run: docker compose up --build -d --wait postgres migrate app
      - name: Fully ingest all mapped macro/index series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: timeout 150s docker compose run --rm -e FRED_API_KEY worker python -m finance_dashboard.worker --once --macro-only --full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 32 mapped sources persisted and API queryable
        run: python scripts/all_macro_pg_smoke.py
      - name: Display bounded service logs on failure
        if: failure()
        run: docker compose logs --tail=30 || true
      - name: Remove ephemeral data
        if: always()
        run: docker compose down --volumes --remove-orphans || true
