name: Refresh SEC listed profits via Wisesheets
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 3 * *'
permissions:
  contents: write
concurrency:
  group: monthly-sec-filer-earnings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Run bounded offline financial-source tests
        run: python -m unittest discover -s tests -p 'test_wisesheets.py' -v
      - name: Fetch entire entitled SEC reporting-company universe
        env:
          WISESHEETS_API_KEY: ${{ secrets.WISESHEETS_API_KEY }}
        run: python -m finance_dashboard.wisesheets --output data/wisesheets/sec_filer_profit.json --min-issuers 5000 --max-requests 800
      - name: Validate full issuer coverage, output and key exclusion
        run: python scripts/validate_wisesheets_snapshot.py data/wisesheets/sec_filer_profit.json
      - name: Upload dated aggregate backup
        uses: actions/upload-artifact@v4
        with:
          name: sec-filer-earnings-usd
          path: data/wisesheets/sec_filer_profit.json
          retention-days: 90
          if-no-files-found: error
      - name: Persist audited aggregate for API and next static build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/wisesheets/sec_filer_profit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update complete monthly SEC-filer net-income aggregate"
          git pull --rebase origin main
          git push origin HEAD:main
