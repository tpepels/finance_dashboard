name: Probe free OECD sector accounts
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_oecd_sector.py
      - .github/workflows/probe-oecd-sector.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official public OECD SDMX structures and small data slices
        run: timeout 95s python scripts/probe_oecd_sector.py
