# Paste this service into the existing home-server services: block.
# Clone repo alongside monochrome, yt-dlp-server, vinted-dashboard, etc.
  finance-dashboard:
    build:
      context: ./finance_dashboard
      dockerfile: Dockerfile
    container_name: finance-dashboard
    user: "${UID}:${GID}"
    ports:
      - "${FINANCE_BIND_HOST:-0.0.0.0}:${FINANCE_PORT:-5052}:8080"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      FRED_API_KEY: ${FRED_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      FINANCE_AUTO_REFRESH: "${FINANCE_AUTO_REFRESH:-1}"
      FINANCE_REFRESH_ON_START: "${FINANCE_REFRESH_ON_START:-1}"
      FINANCE_INCLUDE_MARKETS: "${FINANCE_INCLUDE_MARKETS:-1}"
      FINANCE_WISESHEETS_REFRESH: "${FINANCE_WISESHEETS_REFRESH:-1}"
      FINANCE_VINTAGE_REFRESH: "${FINANCE_VINTAGE_REFRESH:-1}"
      FINANCE_SEC_HOLDINGS_REFRESH: "${FINANCE_SEC_HOLDINGS_REFRESH:-0}"
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
      FINANCE_SOURCE_POLICY_DB: "/data/source-policy/rate-ledger.sqlite3"
      FINANCE_SOURCE_POLICY_ACKNOWLEDGED: "${FINANCE_SOURCE_POLICY_ACKNOWLEDGED:-}"
      FINANCE_AUTO_BACKUP: "${FINANCE_AUTO_BACKUP:-1}"
      FINANCE_BACKUP_DIR: "/data/backups"
      FINANCE_BACKUP_KEEP: "${FINANCE_BACKUP_KEEP:-14}"
      WISESHEETS_API_KEY: ${WISESHEETS_API_KEY:-}
      REFRESH_INTERVAL_SECONDS: "${REFRESH_INTERVAL_SECONDS:-86400}"
    volumes:
      - /srv/finance-dashboard:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
