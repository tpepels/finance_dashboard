# Local-only deployment. One container: React + FastAPI + SQLite +
# scheduled macro source updates and monthly SEC-filer Wisesheets collection.
services:
  finance-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-dashboard
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${FINANCE_BIND_HOST:-0.0.0.0}:${FINANCE_PORT:-5052}:8080"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      FRED_API_KEY: ${FRED_API_KEY:-}
      WISESHEETS_API_KEY: ${WISESHEETS_API_KEY:-}
      FINANCE_AUTO_REFRESH: "1"
      FINANCE_INCLUDE_MARKETS: "${FINANCE_INCLUDE_MARKETS:-1}"
      FINANCE_WISESHEETS_REFRESH: "1"
      FINANCE_VINTAGE_REFRESH: "${FINANCE_VINTAGE_REFRESH:-1}"
      FINANCE_SEC_HOLDINGS_REFRESH: "${FINANCE_SEC_HOLDINGS_REFRESH:-1}"
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
      # The shared SQLite ledger is separate from immutable source archives.
      FINANCE_SOURCE_POLICY_DB: "/data/source-policy/rate-ledger.sqlite3"
      # Publisher restricts VPN/anonymized OECD API access; explicit user attestation.
      FINANCE_SOURCE_POLICY_ACKNOWLEDGED: "${FINANCE_SOURCE_POLICY_ACKNOWLEDGED:-}"
      FINANCE_AUTO_BACKUP: "${FINANCE_AUTO_BACKUP:-1}"
      FINANCE_BACKUP_DIR: "/data/backups"
      FINANCE_BACKUP_KEEP: "${FINANCE_BACKUP_KEEP:-14}"
      REFRESH_INTERVAL_SECONDS: "86400"
    volumes:
      - ${FINANCE_DATA_DIR:-./data-local}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
