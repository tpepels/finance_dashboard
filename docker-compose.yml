services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capital_monitor
      POSTGRES_USER: capital_monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital_monitor -d capital_monitor"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://capital_monitor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/capital_monitor
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://capital_monitor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/capital_monitor
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://capital_monitor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/capital_monitor
      REFRESH_INTERVAL_SECONDS: "86400"
    command: ["python", "-m", "finance_dashboard.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
